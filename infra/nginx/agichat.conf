# Copiar al servidor como /etc/nginx/sites-enabled/agichat
#   sudo cp infra/nginx/agichat.conf /etc/nginx/sites-enabled/agichat
#   sudo nginx -t && sudo nginx -s reload
# Puertos: 3230 -> agichat_web, 3231 -> agichat_server

# IP real del cliente detras de Cloudflare (el rate limit del backend la usa)
map $http_cf_connecting_ip $agichat_ip {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}

server {
    listen 80;
    server_name agichat.jhgo.online;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name agichat.jhgo.online;
    ssl_certificate /etc/nginx/ssl/cloudflare.crt;
    ssl_certificate_key /etc/nginx/ssl/cloudflare.key;

    location /api/ {
        proxy_pass http://127.0.0.1:3231;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $agichat_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;          # SSE: sin esto el streaming llega de golpe
        proxy_read_timeout 300s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:3231;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://127.0.0.1:3230;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
